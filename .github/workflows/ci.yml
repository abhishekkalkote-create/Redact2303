name: CI

on:
  push:
    branches: [main]
  pull_request:

# specs/02-architecture.md § Environments & CI/CD: lint, typecheck, unit + RLS + golden-file
# tests, tf plan. Golden-file pipeline tests land in Phase 1 (workers/detect don't exist yet).
# `terraform plan` needs real cloud credentials (OIDC role) that don't exist yet either — this
# runs `validate` in the meantime; see the `terraform` job below.

jobs:
  api:
    name: API — lint, typecheck, test (incl. RLS matrix)
    runs-on: ubuntu-latest
    services:
      # POSTGRES_USER here is the cluster's bootstrap superuser - used ONLY to create the
      # actual app role below. Postgres refuses `ALTER ROLE ... NOSUPERUSER` on the
      # bootstrap user itself ("the bootstrap user must have the SUPERUSER attribute"),
      # and RLS/REVOKE (migration 0002's _append_only()) are unconditionally bypassed for
      # superusers - so the app must run as a separate, ordinary role, never as this one.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: postgres_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      # app/pipeline/ocr.py's Tesseract fallback path (tests/test_ocr.py) needs the real
      # binary present - same package installed in api/Dockerfile for the deployed image.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: mypy app

      - name: Create the non-superuser app role + test database
        # redactproof must be an ordinary role - not the bootstrap superuser above - for
        # RLS and migration 0002's REVOKE to mean anything at all in this CI run. Same
        # role app/core/config.py's Settings.database_url default already names
        # (api/.env.example), so nothing downstream needs to change.
        env:
          PGPASSWORD: postgres_admin
        run: |
          psql -h localhost -U postgres_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE redactproof WITH LOGIN PASSWORD 'redactproof';"
          psql -h localhost -U postgres_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE redactproof_test OWNER redactproof;"
          psql -h localhost -U postgres_admin -d redactproof_test -v ON_ERROR_STOP=1 -c \
            "ALTER SCHEMA public OWNER TO redactproof;"

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql+asyncpg://redactproof:redactproof@localhost:5432/redactproof_test
        run: alembic upgrade head

      - name: Test (RLS isolation matrix + unit)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://redactproof:redactproof@localhost:5432/redactproof_test
        run: pytest -v

      - name: Export OpenAPI schema
        env:
          DATABASE_URL: postgresql+asyncpg://redactproof:redactproof@localhost:5432/redactproof_test
        run: python -m scripts.export_openapi

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: shared/openapi.json

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: shared

      - name: Generate TS types from the OpenAPI contract
        working-directory: shared
        run: npm run generate

      - name: Fail if generated types drifted from committed types
        run: git diff --exit-code -- shared/src/api-types.ts shared/openapi.json

      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  terraform:
    name: Terraform — fmt, validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend=false
      - run: terraform validate

      # TODO: switch to `terraform plan` against the real dev backend once
      # infra/envs/dev/backend.hcl exists and a GitHub OIDC role is configured (see the
      # cloud-account setup steps) — plan needs real AWS credentials, which don't exist yet.
