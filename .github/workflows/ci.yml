name: CI

on:
  push:
    branches: [main]
  pull_request:

# specs/02-architecture.md § Environments & CI/CD: lint, typecheck, unit + RLS + golden-file
# tests, tf plan. Golden-file pipeline tests land in Phase 1 (workers/detect don't exist yet).
# `terraform plan` needs real cloud credentials (OIDC role) that don't exist yet either — this
# runs `validate` in the meantime; see the `terraform` job below.

jobs:
  api:
    name: API — lint, typecheck, test (incl. RLS matrix)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redactproof
          POSTGRES_PASSWORD: redactproof
          POSTGRES_DB: redactproof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redactproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: mypy app

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql+asyncpg://redactproof:redactproof@localhost:5432/redactproof_test
        run: alembic upgrade head

      - name: Test (RLS isolation matrix + unit)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://redactproof:redactproof@localhost:5432/redactproof_test
        run: pytest -v

      - name: Export OpenAPI schema
        env:
          DATABASE_URL: postgresql+asyncpg://redactproof:redactproof@localhost:5432/redactproof_test
        run: python -m scripts.export_openapi

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: shared/openapi.json

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: shared

      - name: Generate TS types from the OpenAPI contract
        working-directory: shared
        run: npm run generate

      - name: Fail if generated types drifted from committed types
        run: git diff --exit-code -- shared/src/api-types.ts shared/openapi.json

      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  terraform:
    name: Terraform — fmt, validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend=false
      - run: terraform validate

      # TODO: switch to `terraform plan` against the real dev backend once
      # infra/envs/dev/backend.hcl exists and a GitHub OIDC role is configured (see the
      # cloud-account setup steps) — plan needs real AWS credentials, which don't exist yet.
