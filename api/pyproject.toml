[project]
name = "redactproof-api"
version = "0.1.0"
description = "RedactProof API — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "python-ulid>=2.2",
    "pyjwt[crypto]>=2.9",
    "boto3>=1.35",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "pymupdf>=1.28",
    "pikepdf>=10.10",
    "presidio-analyzer>=2.2",
    "python-magic>=0.4.27",
    "clamd>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends()-in-defaults is the framework's idiomatic DI pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
