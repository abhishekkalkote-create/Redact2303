services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: redactproof
      POSTGRES_PASSWORD: redactproof
      POSTGRES_MULTIPLE_DATABASES: redactproof,redactproof_test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redactproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
